# chasm docs — Jekyll config for GitHub Pages (publishing from /docs)
title: chasm
description: "Persistent Linux VMs for coding agents, on your own machine."
lang: en
logo: /assets/logo-512.png

# Link previews (Open Graph / Twitter cards) for every page.
twitter:
  username: rahulrajaramio
  card: summary_large_image
author:
  twitter: rahulrajaramio

# Project site served at https://rahulrajaram.github.io/chasm/
url: "https://rahulrajaram.github.io"
baseurl: "/chasm"
github_url: "https://github.com/rahulrajaram/chasm"
edit_branch: master

permalink: none

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge

# Both plugins are on the GitHub Pages allow-list.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Existing guides keep their flat URLs.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: guide
      image:
        path: /assets/social-card.png
        width: 1200
        height: 630
        alt: "chasm: Long-horizon VMs for long-horizon agents"


exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
