<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Chasm network boundaries</title><desc id="desc">Guests on the chasmbr0 IPv4 bridge reach each other directly and reach public IPv4 through NAT. The host's inet chasm nftables table drops private and reserved destinations, drops IPv6, and admits only DNS and DHCP to the host.</desc><rect width="760" height="650" fill="#101010"/><rect x="20" y="14" width="348" height="76" rx="12" fill="#171717" stroke="#facc15" stroke-width="2"/><text x="194.0" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">Public IPv4 destinations</text><text x="194.0" y="71" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Allowed, masqueraded by NAT</text><rect x="392" y="14" width="348" height="76" rx="12" fill="#171717" stroke="#a8a29e" stroke-width="2"/><text x="566.0" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">Private/reserved IPv4</text><text x="566.0" y="71" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Dropped on forward (13 ranges)</text><path d="M194 154V97 M188 106 L194 97 L200 106" stroke="#facc15" stroke-width="2" fill="none"/><text x="126" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#f5f5f4">egress</text><path d="M566 154V110" stroke="#facc15" stroke-width="2" fill="none"/><path d="M554 110H578" stroke="#facc15" stroke-width="2" fill="none"/><text x="510" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#f5f5f4">drop</text><rect x="20" y="158" width="720" height="100" rx="12" fill="#171717" stroke="#facc15" stroke-width="2"/><text x="380.0" y="189" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">Host: nftables table inet chasm</text><text x="380.0" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Input from the bridge: DNS (53) and DHCP (67) only</text><text x="380.0" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">IPv6 from the bridge is dropped on input and forward</text><path d="M380 334V265 M374 274 L380 265 L386 274" stroke="#facc15" stroke-width="2" fill="none"/><text x="450" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#f5f5f4">routed IPv4</text><rect x="20" y="338" width="720" height="76" rx="12" fill="#171717" stroke="#facc15" stroke-width="2"/><text x="380.0" y="369" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">chasmbr0 NAT bridge · 10.77.0.1/24</text><text x="380.0" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">IPv4 only: the bridge has no IPv6 address</text><path d="M170 494V421 M164 430 L170 421 L176 430" stroke="#facc15" stroke-width="2" fill="none"/><path d="M590 494V421 M584 430 L590 421 L596 430" stroke="#facc15" stroke-width="2" fill="none"/><rect x="20" y="498" width="300" height="100" rx="12" fill="#171717" stroke="#a8a29e" stroke-width="2"/><text x="170.0" y="529" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">Guest A</text><text x="170.0" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Address in 10.77.0.2–254</text><text x="170.0" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">DNS and DHCP from the host</text><rect x="440" y="498" width="300" height="100" rx="12" fill="#171717" stroke="#a8a29e" stroke-width="2"/><text x="590.0" y="529" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">Guest B</text><text x="590.0" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Address in 10.77.0.2–254</text><text x="590.0" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">DNS and DHCP from the host</text><path d="M327 552H433 M424 546 L433 552 L424 558 M336 546 L327 552 L336 558" stroke="#facc15" stroke-width="2" fill="none"/><text x="380" y="540" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#f5f5f4">peer IPv4</text><text x="380" y="628" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Guest-to-guest IPv4 is switched in the bridge, outside these rules</text></svg>
