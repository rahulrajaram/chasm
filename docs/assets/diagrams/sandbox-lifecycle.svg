<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc"><title id="title">Chasm sandbox lifecycle</title><desc id="desc">chasm create leaves a sandbox stopped. start boots it, pause and resume freeze and unfreeze it, stop returns it to stopped, and delete removes a stopped sandbox's root disk and /workspace while /shared survives.</desc><rect width="760" height="620" fill="#101010"/><rect x="20" y="14" width="720" height="100" rx="12" fill="#171717" stroke="#facc15" stroke-width="2"/><text x="380.0" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">chasm create NAME</text><text x="380.0" y="71" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Clones the sealed template and adds a /workspace volume</text><text x="380.0" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Provisions the guest, then leaves the sandbox stopped</text><path d="M180 118V175 M174 166 L180 175 L186 166" stroke="#facc15" stroke-width="2" fill="none"/><rect x="20" y="182" width="320" height="100" rx="12" fill="#171717" stroke="#facc15" stroke-width="2"/><text x="180.0" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">Stopped</text><text x="180.0" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Disks kept; no memory in use</text><text x="180.0" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">resize and delete only here</text><rect x="420" y="182" width="320" height="100" rx="12" fill="#171717" stroke="#facc15" stroke-width="2"/><text x="580.0" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">Running</text><text x="580.0" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Guest agent ready</text><text x="580.0" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Budget counts toward headroom</text><path d="M344 214H413 M404 208 L413 214 L404 220" stroke="#facc15" stroke-width="2" fill="none"/><text x="380" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#f5f5f4">start</text><path d="M416 252H347 M356 246 L347 252 L356 258" stroke="#facc15" stroke-width="2" fill="none"/><text x="380" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#f5f5f4">stop</text><rect x="20" y="350" width="320" height="100" rx="12" fill="#171717" stroke="#a8a29e" stroke-width="2"/><text x="180.0" y="381" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">Deleted</text><text x="180.0" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Root disk and /workspace gone</text><text x="180.0" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">/shared is never touched</text><rect x="420" y="350" width="320" height="100" rx="12" fill="#171717" stroke="#a8a29e" stroke-width="2"/><text x="580.0" y="381" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">Paused</text><text x="580.0" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Frozen in place, memory kept</text><text x="580.0" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">stop and delete are refused</text><path d="M180 286V343 M174 334 L180 343 L186 334" stroke="#facc15" stroke-width="2" fill="none"/><text x="126" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#f5f5f4">delete</text><path d="M540 286V343 M534 334 L540 343 L546 334" stroke="#facc15" stroke-width="2" fill="none"/><text x="490" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#f5f5f4">pause</text><path d="M620 346V289 M614 298 L620 289 L626 298" stroke="#facc15" stroke-width="2" fill="none"/><text x="674" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#f5f5f4">resume</text><rect x="20" y="474" width="720" height="130" rx="12" fill="#171717" stroke="#a8a29e" stroke-width="2"/><text x="380" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">Transitions</text><text x="380" y="531" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">start: admission check, boot, then wait for the guest agent</text><text x="380" y="554" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">stop: graceful shutdown, forced after 60 s; running memory is lost</text><text x="380" y="577" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">start on a paused sandbox also resumes it, after admission</text></svg>
