<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 525" role="img" aria-labelledby="title desc"><title id="title">Chasm control plane</title><desc id="desc">Shell access uses a sudo-gated helper. Lifecycle commands reach Incus through the supervisor and root executor.</desc><rect width="760" height="525" fill="#101010"/><rect x="20" y="14" width="720" height="76" rx="12" fill="#171717" stroke="#a8a29e" stroke-width="2"/><text x="380.0" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">Operator on the Debian host</text><text x="380.0" y="71" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">chasm and chasmctl run without root privileges</text><path d="M194 94V151 m-6 -9 6 9 6 -9" stroke="#facc15" stroke-width="2" fill="none"/><path d="M566 94V151 m-6 -9 6 9 6 -9" stroke="#facc15" stroke-width="2" fill="none"/><text x="126" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#f5f5f4">chasm shell</text><text x="472" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#f5f5f4">Supervisor socket</text><rect x="20" y="158" width="348" height="76" rx="12" fill="#171717" stroke="#facc15" stroke-width="2"/><text x="194.0" y="189" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">chasm __shell</text><text x="194.0" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Root-owned helper · narrow sudo grant</text><rect x="392" y="158" width="348" height="76" rx="12" fill="#171717" stroke="#a8a29e" stroke-width="2"/><text x="566.0" y="189" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">chasm-supervisor.service</text><text x="566.0" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Dedicated unprivileged service user</text><path d="M566 240V296 m-6 -9 6 9 6 -9" stroke="#facc15" stroke-width="2" fill="none"/><text x="470" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#f5f5f4">Peer credentials</text><rect x="392" y="303" width="348" height="76" rx="12" fill="#171717" stroke="#facc15" stroke-width="2"/><text x="566.0" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">chasm-executor.service</text><text x="566.0" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Root · fixed operations and audit log</text><path d="M194 240V426 m-6 -9 6 9 6 -9" stroke="#facc15" stroke-width="2" fill="none"/><text x="125" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#f5f5f4">incus exec</text><path d="M566 385V426 m-6 -9 6 9 6 -9" stroke="#facc15" stroke-width="2" fill="none"/><rect x="20" y="433" width="720" height="76" rx="12" fill="#171717" stroke="#a8a29e" stroke-width="2"/><text x="380.0" y="464" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">Incus</text><text x="380.0" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Guest VMs, workspace volumes and networking</text></svg>
