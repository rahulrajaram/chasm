<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc"><title id="title">Chasm storage lifetimes</title><desc id="desc">All sandbox storage lives in one Incus pool. Each sandbox's VM root disk and /workspace volume survive stop and are removed by delete; the site-wide /shared volume survives every sandbox deletion.</desc><rect width="760" height="470" fill="#101010"/><rect x="20" y="14" width="720" height="440" rx="12" fill="#171717" stroke="#a8a29e" stroke-width="2"/><text x="380" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">Incus storage pool (storage_pool, default chasm)</text><text x="380" y="71" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Loop-backed btrfs file by default: /var/lib/incus/disks/&lt;pool&gt;.img</text><text x="380" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">pool_size_gib (default 64 GiB) caps the pool; it reserves nothing</text><rect x="44" y="124" width="672" height="76" rx="12" fill="#171717" stroke="#a8a29e" stroke-width="2"/><text x="64" y="155" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">VM root disk</text><text x="64" y="181" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">One per sandbox · includes /home/agent</text><text x="696" y="155" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Survives stop</text><text x="696" y="181" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Removed by delete</text><rect x="44" y="216" width="672" height="76" rx="12" fill="#171717" stroke="#a8a29e" stroke-width="2"/><text x="64" y="247" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">/workspace volume</text><text x="64" y="273" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">One per sandbox · private to it</text><text x="696" y="247" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Survives stop</text><text x="696" y="273" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Removed by delete</text><rect x="44" y="308" width="672" height="76" rx="12" fill="#171717" stroke="#facc15" stroke-width="2"/><text x="64" y="339" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#f5f5f4">/shared volume</text><text x="64" y="365" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">One per site · read-write in every sandbox</text><text x="696" y="339" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">Survives stop</text><text x="696" y="365" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#facc15">Survives delete</text><text x="380" y="426" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#d6d3d1">/workspace and /shared reach each guest as virtiofs disk shares</text></svg>
