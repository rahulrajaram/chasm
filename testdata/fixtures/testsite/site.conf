# Neutral site descriptor used by the Go and shell test suites.
#
# It is deliberately not the historical site: a test that depended on the old
# host's network, pool, or user names would hide exactly the coupling the
# portability gate removed. Values are small and inert (an 8 GiB pool, a 512 MiB reserve) so test
# arithmetic is easy to read.

site_name=chasm-test

bridge_name=chasmbr0
bridge_ipv4=10.42.0.1/24
sandbox_ipv4_prefix=10.42.0.

storage_pool=chasm-test
pool_size_gib=8
profile_name=chasm
base_image_alias=chasm-test-13
base_image_remote=images:debian/13/cloud

operator_user=chasmops
guest_uid=1001
supervisor_user=chasm-supervisor

host_reserve_mib=512


default_sandbox=
