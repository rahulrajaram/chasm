# Site descriptor variant used by the resource_prefix tests: the same
# neutral site as testsite/site.conf, with Incus objects named from the
# agent-sandbox prefix (the canonical "adopting an existing installation's
# Incus objects" example) instead of the default chasm one.

site_name=chasm-test

bridge_name=chasmbr0
bridge_ipv4=10.42.0.1/24
sandbox_ipv4_prefix=10.42.0.

storage_pool=chasm-test
pool_size_gib=8
profile_name=chasm
base_image_alias=chasm-test-13
base_image_remote=images:debian/13/cloud
resource_prefix=agent-sandbox

operator_user=chasmops
guest_uid=1001
supervisor_user=chasm-supervisor

host_reserve_mib=512

default_sandbox=
